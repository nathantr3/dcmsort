<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    dcmsort app icon.

    The mark is the app's own slice-by-phase grid: rows are slices, columns are
    phases, and the columns are grouped into coloured blocks with gaps between
    them - which is exactly what the app does to a series. Colours are taken
    from the child-series palette in src/main/rules.js.

    Geometry follows the macOS grid: the rounded square is inset to 824px of
    the 1024px canvas so it matches the size of stock icons on the dock.
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#31363f" />
      <stop offset="100%" stop-color="#15171b" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#plate)" />
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#sheen)" />
    <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" ry="184.5"
          fill="none" stroke="#000000" stroke-opacity="0.55" stroke-width="1" />
  </g>

  <!--
    Grid: 6 slice rows x 5 phase columns, split into three groups.
    Cell 78x78 on a 96px pitch; group gaps of 46px sit between the blocks.
    Total width 5*96 - 18 + 2*46 = 554, centred by starting at x = 235.
  -->
  <g>
    <!-- group 1: phases 1-2 -->
    <g fill="#4EC9B0">
      <rect x="235" y="272" width="78" height="78" rx="16" />
      <rect x="331" y="272" width="78" height="78" rx="16" />
      <rect x="235" y="368" width="78" height="78" rx="16" />
      <rect x="331" y="368" width="78" height="78" rx="16" />
      <rect x="235" y="464" width="78" height="78" rx="16" />
      <rect x="331" y="464" width="78" height="78" rx="16" />
      <rect x="235" y="560" width="78" height="78" rx="16" />
      <rect x="331" y="560" width="78" height="78" rx="16" />
      <rect x="235" y="656" width="78" height="78" rx="16" />
      <rect x="331" y="656" width="78" height="78" rx="16" />
    </g>

    <!-- group 2: phases 3-4 -->
    <g fill="#569CD6">
      <rect x="473" y="272" width="78" height="78" rx="16" />
      <rect x="569" y="272" width="78" height="78" rx="16" />
      <rect x="473" y="368" width="78" height="78" rx="16" />
      <rect x="569" y="368" width="78" height="78" rx="16" />
      <rect x="473" y="464" width="78" height="78" rx="16" />
      <rect x="569" y="464" width="78" height="78" rx="16" />
      <rect x="473" y="560" width="78" height="78" rx="16" />
      <rect x="569" y="560" width="78" height="78" rx="16" />
      <rect x="473" y="656" width="78" height="78" rx="16" />
      <rect x="569" y="656" width="78" height="78" rx="16" />
    </g>

    <!-- group 3: phase 5 -->
    <g fill="#C586C0">
      <rect x="711" y="272" width="78" height="78" rx="16" />
      <rect x="711" y="368" width="78" height="78" rx="16" />
      <rect x="711" y="464" width="78" height="78" rx="16" />
      <rect x="711" y="560" width="78" height="78" rx="16" />
      <rect x="711" y="656" width="78" height="78" rx="16" />
    </g>
  </g>
</svg>
